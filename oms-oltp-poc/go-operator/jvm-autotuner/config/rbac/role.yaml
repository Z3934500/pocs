# ClusterRole, ClusterRoleBinding, and ServiceAccount for the jvm-autotuner controller.
# Apply with: kubectl apply -f config/rbac/role.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jvm-autotuner-controller
  namespace: jvm-autotuner-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jvm-autotuner-role
rules:
  # Manage the custom resource and its status subresource.
  - apiGroups: ["jvm.oms.io"]
    resources: ["jvmautotuners"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["jvm.oms.io"]
    resources: ["jvmautotuners/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["jvm.oms.io"]
    resources: ["jvmautotuners/finalizers"]
    verbs: ["update"]
  # Read and patch target Deployments (only patch — never delete).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  # Emit Kubernetes events for visibility.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Leader election: controller-runtime uses ConfigMaps + Leases.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jvm-autotuner-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jvm-autotuner-role
subjects:
  - kind: ServiceAccount
    name: jvm-autotuner-controller
    namespace: jvm-autotuner-system
