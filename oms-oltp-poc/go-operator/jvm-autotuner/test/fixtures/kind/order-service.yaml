apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: jvm-autotuner-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              sleep 90
              while true; do
                printf 'HTTP/1.1 200 OK\r\nContent-Length: 2\r\n\r\nOK' | nc -l -p 8080
              done
          env:
            - name: JAVA_OPTS
              value: "-Xmx1024m"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 30
