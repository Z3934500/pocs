apiVersion: apps/v1
kind: Deployment
metadata:
  name: oms-oltp-poc
  labels:
    app: oms-oltp-poc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oms-oltp-poc
  template:
    metadata:
      labels:
        app: oms-oltp-poc
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/OWNER/oms-oltp-poc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: OMS_SQLITE_PATH
              value: /app/data/oms_oltp.sqlite
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          emptyDir: {}
