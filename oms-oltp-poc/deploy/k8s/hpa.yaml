apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oms-oltp-poc-hpa
  labels:
    app: oms-oltp-poc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oms-oltp-poc
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
