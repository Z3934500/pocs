---
# Deployment Steps:
#
# 1. Install KEDA operator (if not already installed):
#    kubectl apply -f https://github.com/kedacore/keda/releases/download/v2.14.0/keda-2.14.0.yaml
#
# 2. Verify KEDA is running:
#    kubectl get pods -n keda
#    # Expected: keda-operator and keda-metrics-apiserver pods running
#
# 3. Update keda-kafka-secrets with your MSK bootstrap servers:
#    kubectl create secret generic keda-kafka-secrets \
#      --from-literal=bootstrapServers="your-msk-bootstrap-servers" \
#      -n cce-platform
#
# 4. Apply this configuration:
#    kubectl apply -f ADR-005-keda-kafka-scaler.yaml
#
# 5. Verify ScaledObject is active:
#    kubectl get scaledobject -n cce-platform
#    kubectl describe scaledobject cce-realtime-stream-scaler -n cce-platform
#
# 6. Check HPA created by KEDA:
#    kubectl get hpa -n cce-platform
#    # Expected: keda-hpa-cce-realtime-stream-scaler
#
# 7. Monitor scaling events:
#    kubectl get events -n cce-platform --field-selector involvedObject.name=cce-realtime-feature-stream --watch
#
# 8. View KEDA metrics (if using Prometheus):
#    kubectl port-forward -n keda svc/keda-operator-metrics-apiserver 8080:8080
#    curl http://localhost:8080/metrics | grep cce_realtime

---
# Troubleshooting:
#
# Problem: ScaledObject shows "Unknown" status
# Solution: Check KEDA can connect to Kafka
#   kubectl logs -n keda deployment/keda-operator | grep cce-realtime-stream-scaler
#
# Problem: Pods not scaling despite high lag
# Solution: Verify lag threshold calculation
#   # Get current lag from Kafka
#   kafka-consumer-groups.sh --bootstrap-server $KAFKA_BOOTSTRAP \
#     --describe --group cce-realtime-feature-stream
#
#   # Check KEDA's computed metric
#   kubectl get --raw "/apis/external.metrics.k8s.io/v1beta1/namespaces/cce-platform/s0-kafka-cce-rds-orders" | jq .
#
# Problem: Scaling too aggressively (flapping)
# Solution: Increase cooldownPeriod or stabilizationWindowSeconds
#   cooldownPeriod: 600  # 10 minutes
#
# Problem: StatefulSet stuck during scale-down
# Solution: Check RocksDB state volume is healthy
#   kubectl exec -it cce-realtime-feature-stream-0 -n cce-platform -- df -h /var/lib/kafka-streams
#   kubectl describe pvc rocksdb-state-cce-realtime-feature-stream-0 -n cce-platform

---
# Performance Tuning:
#
# 1. Partition count vs Max replicas:
#    - Each Kafka consumer (pod) handles ≥1 partition
#    - maxReplicaCount should not exceed partition count
#    - If need more than 6 pods, increase Kafka partitions first:
#      kafka-topics.sh --bootstrap-server $KAFKA_BOOTSTRAP \
#        --alter --topic cce.rds.orders --partitions 12
#
# 2. Lag threshold calculation:
#    lagThreshold = single_pod_throughput × desired_recovery_time
#
#    Example:
#    - Single pod processes 100 events/sec
#    - Want to recover from lag in 60 seconds
#    - lagThreshold = 100 × 60 = 6000
#
# 3. Scale-up speed vs stability:
#    - Faster scale-up: decrease pollingInterval, increase scaleUp.value
#    - More stability: increase cooldownPeriod, decrease scaleUp.value
#
# 4. Cost optimization:
#    - Set minReplicaCount to 1 if tolerate brief unavailability
#    - Set activationLagThreshold high to scale to min during idle
#    - Use spot instances for StatefulSet (with careful pod disruption budget)

---
# Monitoring Queries (Prometheus/Grafana):
#
# 1. Current consumer lag per topic:
#    kafka_consumergroup_lag{consumergroup="cce-realtime-feature-stream"}
#
# 2. Lag per pod (if scaled):
#    sum(kafka_consumergroup_lag{consumergroup="cce-realtime-feature-stream"})
#    / count(kube_pod_info{namespace="cce-platform", pod=~"cce-realtime-feature-stream-.*"})
#
# 3. Scaling events:
#    keda_scaler_active{scaledObject="cce-realtime-stream-scaler"}
#
# 4. Time to process lag:
#    kafka_consumergroup_lag / rate(kafka_topic_partition_current_offset[5m])
#
# 5. RocksDB state size growth:
#    sum(container_fs_usage_bytes{namespace="cce-platform", pod=~"cce-realtime-feature-stream-.*", mountpoint="/var/lib/kafka-streams"})

---
# Migration from Phase 1 to Phase 2 Checklist:
#
# Before cutover:
# - [ ] Test in staging: generate artificial lag, verify scaling behavior
# - [ ] Measure RocksDB state redistribution time (should be <5min per partition)
# - [ ] Set CloudWatch alarms for KEDA operator health
# - [ ] Document rollback procedure (delete ScaledObject → replicas revert to StatefulSet spec)
#
# During cutover:
# - [ ] Apply KEDA configuration during low-traffic window
# - [ ] Watch for 1 hour: kubectl get hpa -n cce-platform --watch
# - [ ] Verify no unexpected scale-ups/downs
#
# After cutover:
# - [ ] Update on-call runbook: remove manual scaling steps
# - [ ] Set up Grafana dashboard with lag, pod count, and scaling events
# - [ ] Review cost: compare fixed 2 pods vs auto-scaled average over 1 month
