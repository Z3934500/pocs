# KEDA Configuration for Phase 2: Kafka Lag-Based Autoscaling
#
# Prerequisites:
# 1. KEDA operator installed: kubectl apply -f https://github.com/kedacore/keda/releases/download/v2.14.0/keda-2.14.0.yaml
# 2. Kafka metrics available via:
#    - Option A: Prometheus with Kafka Exporter (recommended)
#    - Option B: AWS CloudWatch Container Insights
# 3. Kafka consumer group: cce-realtime-feature-stream
# 4. Topics: cce.rds.orders, cce.rds.cart_events
#
# References:
# - KEDA Kafka scaler: https://keda.sh/docs/latest/scalers/apache-kafka/
# - ADR-005: Two-Phase Autoscaling Strategy

---
apiVersion: v1
kind: Secret
metadata:
  name: keda-kafka-secrets
  namespace: cce-platform
type: Opaque
stringData:
  # MSK bootstrap servers (same as stream job uses)
  bootstrapServers: "b-1.msk-cluster.abc123.kafka.ap-southeast-1.amazonaws.com:9092,b-2.msk-cluster.abc123.kafka.ap-southeast-1.amazonaws.com:9092,b-3.msk-cluster.abc123.kafka.ap-southeast-1.amazonaws.com:9092"

  # If using SASL authentication (uncomment if needed)
  # sasl: "scram_sha512"
  # username: "kafka-user"
  # password: "kafka-password"

---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-kafka-auth
  namespace: cce-platform
spec:
  secretTargetRef:
    - parameter: bootstrapServers
      name: keda-kafka-secrets
      key: bootstrapServers
    # Uncomment if using SASL
    # - parameter: sasl
    #   name: keda-kafka-secrets
    #   key: sasl
    # - parameter: username
    #   name: keda-kafka-secrets
    #   key: username
    # - parameter: password
    #   name: keda-kafka-secrets
    #   key: password

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: cce-realtime-stream-scaler
  namespace: cce-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: cce-realtime-feature-stream

  # Polling interval: how often KEDA checks Kafka lag
  pollingInterval: 30  # seconds

  # Cooldown period: wait time before scaling down
  # StatefulSet scaling is expensive (RocksDB state redistribution)
  # so we wait longer to avoid thrashing
  cooldownPeriod: 300  # 5 minutes

  # Idle replica count: if all triggers are inactive, scale to this
  # We use minReplicaCount instead (idleReplicaCount: 0 would scale to zero)
  minReplicaCount: 2   # Always keep 2 pods for availability
  maxReplicaCount: 6   # Match Kafka partition count (6 partitions initially)

  # Advanced scaling behavior (optional, for fine-tuning)
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300  # Match cooldownPeriod
          policies:
          - type: Pods
            value: 1           # Scale down by 1 pod at a time
            periodSeconds: 300 # Every 5 minutes
        scaleUp:
          stabilizationWindowSeconds: 0    # Scale up immediately
          policies:
          - type: Pods
            value: 2           # Scale up by 2 pods at a time (faster response)
            periodSeconds: 60  # Every minute
          - type: Percent
            value: 50          # Or 50% of current replicas, whichever is larger
            periodSeconds: 60
          selectPolicy: Max    # Use the policy that scales fastest

  triggers:
    # Trigger 1: cce.rds.orders topic lag
    - type: kafka
      metadata:
        bootstrapServers: ""  # From TriggerAuthentication
        consumerGroup: cce-realtime-feature-stream
        topic: cce.rds.orders

        # Lag threshold per pod
        # If average lag per pod > 5000, scale up
        # Formula: total_lag / current_replicas > lagThreshold → scale up
        lagThreshold: "5000"

        # Activation threshold: KEDA considers this trigger "active" if lag > 100
        # Below this, treat as idle (but minReplicaCount still applies)
        activationLagThreshold: "100"

        # Offset reset policy (if consumer group is new)
        offsetResetPolicy: latest  # or "earliest"

        # Allow idle consumers (don't error if consumer group not yet created)
        allowIdleConsumers: "true"

        # Partition limitation (optional): only consider specific partitions
        # partitionLimitation: "0,1,2,3,4,5"  # all 6 partitions

      authenticationRef:
        name: keda-kafka-auth

    # Trigger 2: cce.rds.cart_events topic lag
    - type: kafka
      metadata:
        bootstrapServers: ""
        consumerGroup: cce-realtime-feature-stream
        topic: cce.rds.cart_events
        lagThreshold: "5000"
        activationLagThreshold: "100"
        offsetResetPolicy: latest
        allowIdleConsumers: "true"
      authenticationRef:
        name: keda-kafka-auth

---
# Optional: ServiceMonitor for Prometheus (if using Prometheus Operator)
# This allows Grafana dashboards to visualize KEDA scaling decisions
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: keda-operator-metrics
  namespace: keda
  labels:
    app: keda-operator
spec:
  selector:
    matchLabels:
      app: keda-operator
  endpoints:
    - port: metrics
      interval: 30s

---
