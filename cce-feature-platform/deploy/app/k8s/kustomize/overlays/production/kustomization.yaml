apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cce-production
resources:
  - ../../deployment.yaml
  - ../../service.yaml
  - ../../hpa.yaml
  - ../../batch-importer-cronjob.yaml
images:
  - name: ghcr.io/OWNER/cce-feature-platform
    newName: ghcr.io/OWNER/cce-feature-platform
    newTag: production
patches:
  - target:
      kind: Deployment
      name: cce-feature-platform
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CCE_RUNTIME_ENV
          value: production
