apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cce-feature-platform.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "cce-feature-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cce-feature-platform.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cce-feature-platform.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: CCE_RUNTIME_ENV
              value: {{ .Values.runtime.env | quote }}
            - name: CCE_SQLITE_PATH
              value: {{ .Values.runtime.sqlitePath | quote }}
            - name: CCE_ONLINE_STORE_PATH
              value: {{ .Values.runtime.onlineStorePath | quote }}
            - name: FEATURE_API_DEFAULT_SCOPE
              value: {{ .Values.runtime.featureApiDefaultScope | quote }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: {{ .Values.secrets.redisUrlKey }}
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
