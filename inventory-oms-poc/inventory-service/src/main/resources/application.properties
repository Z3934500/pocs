spring.application.name=inventory-service
server.port=8082
server.shutdown=graceful
spring.datasource.url=jdbc:h2:file:./data/inventory-db;AUTO_SERVER=TRUE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
# [kb-land] Source: PRODUCTION_DEPLOYMENT_DEVSECOPS.md + AWS_DATABASE_AND_HA_LESSONS.md
# Pattern: Schema lifecycle — use 'validate' in production so Flyway/Liquibase manages DDL.
# POC default is 'update' for local H2 convenience only.
# Production: set spring.jpa.hibernate.ddl-auto=validate via env var DB_DDL_AUTO.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
# [kb-land] Source: AWS_DATABASE_AND_HA_LESSONS.md
# Pattern: Aurora PostgreSQL production data source.
# Replace the H2 URL below with the RDS Proxy endpoint before production deployment.
# spring.datasource.url=jdbc:postgresql://${DB_PROXY_ENDPOINT}:5432/${DB_NAME:oms_inventory}
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# [kb-land] Source: ARCHITECTURE_AND_DEVOPS.md + ORDER_PAYMENT_FLOW.md
# Pattern: Lock timeout — prevents indefinite wait under hot-SKU row-lock contention.
# Alert if lock_wait events persist; investigate lock ordering and missing indexes first.
spring.jpa.properties.jakarta.persistence.lock.timeout=${DB_LOCK_TIMEOUT_MS:3000}
# [kb-land] Source: PRODUCTION_DEPLOYMENT_DEVSECOPS.md
# Pattern: Flyway manages DDL in production. Disabled by default so PoC runs on H2 without
#          requiring a real Aurora cluster. Production: set FLYWAY_ENABLED=true alongside
#          DB_DDL_AUTO=validate (both via Helm values / K8s ConfigMap).
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
inventory.reservation.expiration-scan-ms=60000
messaging.outbox.poll-ms=1000
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.service=${spring.application.name}
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.tracing.enabled=${OTEL_TRACING_ENABLED:false}
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
logging.pattern.level=%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]
# The PoC uses a logging publisher; production selects a Kafka/MSK or SQS adapter.
messaging.transport=logging
messaging.topic=oms.domain-events
messaging.outbox.batch-size=100
messaging.outbox.lease-ms=30000
messaging.outbox.max-attempts=8
messaging.outbox.retry-base-ms=1000
messaging.outbox.retry-max-ms=60000

# Production transport settings. Keep logging as the local default.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=20000
spring.kafka.producer.properties.request.timeout.ms=5000
messaging.sqs.region=${AWS_REGION:us-east-1}
messaging.sqs.queue-url=${SQS_QUEUE_URL:}
messaging.sqs.fifo=${SQS_FIFO:false}
messaging.sqs.endpoint=${SQS_ENDPOINT:}

# Redis/Lua hot path is opt-in. Normal POC tests keep it disabled.
seckill.redis.enabled=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms
spring.data.redis.repositories.enabled=false
seckill.skus=${SECKILL_SKUS:}
seckill.redis.consumer-group=inventory-persistence
seckill.redis.consumer-name=${SECKILL_CONSUMER_NAME:inventory-service}
seckill.redis.consumer-poll-ms=100
seckill.redis.consumer-batch-size=100
seckill.redis.consumer-block-ms=50
seckill.redis.max-delivery-attempts=8
seckill.redis.dedup-ttl-seconds=7200
seckill.redis.stream-max-length=100000
seckill.redis.dlq-ttl-seconds=86400
seckill.redis.dlq-max-length=10000
inventory.reservation.mode=${INVENTORY_RESERVATION_MODE:sync}
inventory.reservation.command-queue-url=${INVENTORY_RESERVATION_COMMAND_QUEUE_URL:}
inventory.reservation.result-queue-url=${INVENTORY_RESERVATION_RESULT_QUEUE_URL:}
inventory.reservation.result-fifo=${INVENTORY_RESERVATION_RESULT_FIFO:true}
inventory.reservation.consumer-poll-ms=${INVENTORY_RESERVATION_CONSUMER_POLL_MS:250}
inventory.reservation.consumer-batch-size=${INVENTORY_RESERVATION_CONSUMER_BATCH_SIZE:10}
inventory.reservation.consumer-wait-seconds=${INVENTORY_RESERVATION_CONSUMER_WAIT_SECONDS:10}

# Queue depth and consumer lag observability. Kafka lag is opt-in because the PoC
# currently publishes events but does not run a Kafka consumer group by default.
management.queue.metrics.initial-delay-ms=5000
management.queue.metrics.refresh-ms=10000
management.kafka.lag.enabled=${KAFKA_LAG_METRICS_ENABLED:false}
management.kafka.lag.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
management.kafka.lag.group-id=${KAFKA_CONSUMER_GROUP_ID:}
management.kafka.lag.topics=${KAFKA_LAG_TOPICS:}
management.kafka.lag.initial-delay-ms=10000
management.kafka.lag.refresh-ms=10000

# ---- Production: RDS Proxy + HikariCP connection pool ----
# [kb-land] Source: AWS_NETWORK_AND_SECURITY_PATTERNS.md
# Pattern: Two-layer connection pool — HikariCP manages Pod→Proxy connections;
# RDS Proxy multiplexes Proxy→Aurora connections across services.
# In production, point spring.datasource.url at the RDS Proxy Endpoint (not Aurora writer).
# Example: spring.datasource.url=jdbc:postgresql://${DB_PROXY_ENDPOINT}:5432/${DB_NAME:oms}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1740000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_MS:60000}
# Anti-pattern: do NOT set maximum-pool-size based on CPU cores.
# Tune to (DB concurrent transactions / Pod count) with headroom for bursts.
# Total DB connections ≈ Pod replicas × DB_POOL_MAX — keep below RDS Proxy MaxConnectionsPercent.
