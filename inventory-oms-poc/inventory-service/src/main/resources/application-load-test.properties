# [kb-land] Source: RATE_LIMIT_LOAD_TEST_PLAN.md
# Profile: load-test — activate with SPRING_PROFILES_ACTIVE=load-test
# Purpose: isolate from real brokers and SQS FIFO queue during load runs.

# ── Messaging: force logging transport (no Kafka, no SQS domain events) ───────
messaging.transport=logging

# ── SQS FIFO inventory command consumer: disable to avoid AWS dependency ───────
# [kb-land] Source: ORDER_INVENTORY_FIFO_SQS.md — SQS FIFO consumer polls a real queue
# Setting a non-AWS endpoint causes a fast-fail; for load test, disable the bean entirely
# via a feature flag respected by SqsInventoryReservationCommandConsumer.
inventory.sqs.consumer.enabled=false

# ── Seckill: disable Redis stream to avoid Redis dependency ───────────────────
# [kb-land] Source: OMS_DESIGN_PATTERNS.md — seckill uses Redis Stream; not under test here
seckill.enabled=false

# ── HikariCP: widen pool ───────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=5000

# Lock timeout: wider during load test to avoid lock-wait errors masking throughput numbers
spring.jpa.properties.jakarta.persistence.lock.timeout=10000

# ── Observability: no remote tracing ──────────────────────────────────────────
management.tracing.sampling.probability=0.0
logging.level.com.poc.inventory.messaging.InventoryOutboxRelay=WARN
