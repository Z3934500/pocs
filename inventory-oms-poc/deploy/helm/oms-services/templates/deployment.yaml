{{- range $name, $svc := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oms-services.fullname" $ }}-{{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: oms
spec:
  replicas: {{ $svc.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: oms
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: {{ include "oms-services.serviceAccountName" $ }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{ if $.Values.scheduling.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ $name }}
              topologyKey: kubernetes.io/hostname
      {{ end }}
      {{ if $.Values.scheduling.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}
      {{ end }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.registry }}/{{ $name }}:{{ $.Values.global.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          env:
            # ── ADOT Java Agent (in-process, NOT Sidecar) ──────────────────────
            # agent.enabled=true  → javaagent injected; Spring Actuator export disabled
            #                       (prevents double spans / duplicate X-Ray nodes)
            # agent.enabled=false → Spring Boot Actuator native OTel (HTTP/4318, MVC-only)
            {{- if $.Values.observability.agent.enabled }}
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:{{ $.Values.observability.agent.javaagentPath }} -XX:MaxRAMPercentage=75"
            # Disable Spring Actuator OTLP export — Agent handles all trace export
            - name: OTEL_TRACING_ENABLED
              value: "false"
            # gRPC 4317: NO /v1/traces path suffix (gRPC Exporter resolves routing internally)
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.observability.tracing.otlpEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ $name | quote }}
            - name: OTEL_TRACES_SAMPLER
              value: "xray"
            - name: OTEL_PROPAGATORS
              value: "xray,tracecontext,baggage"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ $.Values.observability.tracing.samplingProbability | quote }}
            {{- else }}
            # Spring Boot Actuator native OTel — limited to HTTP entry spans only
            # Upgrade to agent.enabled=true for DB/Kafka/Hikari span visibility
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
            - name: OTEL_TRACING_ENABLED
              value: {{ $.Values.observability.tracing.enabled | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.observability.tracing.otlpEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ $name | quote }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ $.Values.observability.tracing.samplingProbability | quote }}
            {{- end }}
            {{- range $key, $value := $svc.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
---
{{- end }}
