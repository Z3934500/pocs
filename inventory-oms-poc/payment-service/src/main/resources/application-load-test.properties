# [kb-land] Source: RATE_LIMIT_LOAD_TEST_PLAN.md
# Profile: load-test — activate with SPRING_PROFILES_ACTIVE=load-test
# Purpose: isolate from real payment provider and KMS during load runs.

# ── Messaging: force logging transport (no Kafka domain events) ───────────────
messaging.transport=logging

# ── Field encryption: disable KMS to remove external latency variable ─────────
# [kb-land] Source: OMS_DESIGN_PATTERNS.md — KMS envelope encryption is a P1/prod concern
# Disabling here keeps load-test latency numbers attributable to service logic only.
payment.field-encryption.enabled=false

# ── HikariCP: widen pool ───────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=5000

# Lock timeout: wider to avoid lock-wait errors masking throughput numbers
spring.jpa.properties.jakarta.persistence.lock.timeout=10000

# ── Observability: no remote tracing ──────────────────────────────────────────
management.tracing.sampling.probability=0.0
logging.level.com.poc.payment.messaging.PaymentOutboxRelay=WARN
