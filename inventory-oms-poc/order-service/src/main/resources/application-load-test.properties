# [kb-land] Source: RATE_LIMIT_LOAD_TEST_PLAN.md
# Profile: load-test — activate with SPRING_PROFILES_ACTIVE=load-test
# Purpose: isolate from real brokers and external dependencies during JMeter/Gatling runs.
# Start: java -Dspring.profiles.active=load-test -jar order-service.jar

# ── Messaging: force logging transport (no Kafka, no SQS) ─────────────────────
# [kb-land] Source: RATE_LIMIT_LOAD_TEST_PLAN.md — broker latency must not be a variable
# LoggingDomainEventPublisher is already the matchIfMissing=true default;
# explicit override ensures no accidental Kafka/SQS activation even if base props change.
messaging.transport=logging

# Disable SQS FIFO inventory command path — direct sync HTTP call instead.
# (SqsFifoInventoryReservationCommandPublisher requires messaging.transport=sqs AND
#  inventory.reservation.mode=sqs-fifo to be active; omitting both is sufficient)
# inventory.reservation.mode is intentionally NOT set → InProcessInventoryReservationCommandPublisher

# ── Database: H2 stays; relax lock timeout for throughput measurement ──────────
# Use a wider lock timeout so lock-wait latency doesn't flatline the test before saturation
spring.jpa.properties.jakarta.persistence.lock.timeout=10000

# ── HikariCP: widen pool to saturate CPU rather than queue at pool ─────────────
# [kb-land] Source: RATE_LIMIT_LOAD_TEST_PLAN.md — report pool saturation vs CPU saturation separately
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=30000

# ── Rate limiting: enforce mode (not shadow) so rate-limit behaviour is testable ─
# [kb-land] Source: RATE_LIMIT_LOAD_TEST_PLAN.md — load test validates that limiter blocks at threshold
rate-limit.shadow-mode=false
rate-limit.policies.create-order.max-requests=500
rate-limit.policies.create-order.bucket-window-seconds=10

# ── Observability: disable remote tracing to avoid OTEL back-pressure ─────────
management.tracing.sampling.probability=0.0
# Suppress console noise from scheduled tasks during load run
logging.level.com.poc.order.messaging.OrderOutboxRelay=WARN
logging.level.com.poc.order.config.OrderSchedulingConfig=WARN
